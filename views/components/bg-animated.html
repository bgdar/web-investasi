{{ define "bg-animated" }}
<div class="">
  <svg
    width="100%"
    height="100%"
    viewBox="0 0 1440 800"
    preserveAspectRatio="xMidYMid slice"
    xmlns="http://www.w3.org/2000/svg"
    style="position: absolute; top: 0; left: 0; z-index: -1"
  >
    <rect width="1440" height="800" fill="#6B7280" />

    <g stroke="#DADADA" stroke-width="1" opacity="0.3">
      <line x1="0" y1="100" x2="1440" y2="100" />
      <line x1="0" y1="200" x2="1440" y2="200" />
      <line x1="0" y1="300" x2="1440" y2="300" />
      <line x1="0" y1="400" x2="1440" y2="400" />
      <line x1="0" y1="500" x2="1440" y2="500" />
      <line x1="0" y1="600" x2="1440" y2="600" />
      <line x1="0" y1="700" x2="1440" y2="700" />
      <line x1="120" y1="0" x2="120" y2="800" />
      <line x1="240" y1="0" x2="240" y2="800" />
      <line x1="360" y1="0" x2="360" y2="800" />
      <line x1="480" y1="0" x2="480" y2="800" />
      <line x1="600" y1="0" x2="600" y2="800" />
      <line x1="720" y1="0" x2="720" y2="800" />
      <line x1="840" y1="0" x2="840" y2="800" />
      <line x1="960" y1="0" x2="960" y2="800" />
      <line x1="1080" y1="0" x2="1080" y2="800" />
      <line x1="1200" y1="0" x2="1200" y2="800" />
      <line x1="1320" y1="0" x2="1320" y2="800" />
    </g>

    <path
      d="M0 700 L180 550 L360 600 L540 450 L720 500 L900 350 L1080 400 L1260 250 L1440 300"
      fill="none"
      stroke="url(#marketGrad)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-dasharray="2200"
      stroke-dashoffset="2200"
    >
      <animate
        attributeName="stroke-dashoffset"
        from="2200"
        to="-2200"
        dur="6s"
        repeatCount="indefinite"
      />
    </path>
    <g fill="#3B82F6">
      <circle cx="180" cy="550" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="2s"
          repeatCount="indefinite"
        />
      </circle>
      <circle cx="360" cy="600" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="2.2s"
          repeatCount="indefinite"
        />
      </circle>
      <circle cx="540" cy="450" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="2.4s"
          repeatCount="indefinite"
        />
      </circle>
      <circle cx="720" cy="500" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="2.6s"
          repeatCount="indefinite"
        />
      </circle>
      <circle cx="900" cy="350" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="2.8s"
          repeatCount="indefinite"
        />
      </circle>
      <circle cx="1080" cy="400" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="3s"
          repeatCount="indefinite"
        />
      </circle>
      <circle cx="1260" cy="250" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="3.2s"
          repeatCount="indefinite"
        />
      </circle>
      <circle cx="1440" cy="300" r="6">
        <animate
          attributeName="r"
          values="0;6;0"
          dur="3.4s"
          repeatCount="indefinite"
        />
      </circle>
    </g>

    <defs>
      <linearGradient id="marketGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#22C55E" />
        <stop offset="100%" stop-color="#4682B4" />
      </linearGradient>
    </defs>
  </svg>

  <div class="absolute">
    <svg
      width="120"
      height="120"
      viewBox="0 0 120 120"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle cx="60" cy="60" r="40" fill="#10B981" opacity="0.2">
        <animate
          attributeName="r"
          from="40"
          to="55"
          dur="2s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="opacity"
          from="0.3"
          to="0"
          dur="2s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="60" cy="60" r="30" fill="#10B981" />

      <text
        x="60"
        y="68"
        text-anchor="middle"
        font-size="28"
        font-weight="bold"
        fill="#ffffff"
      >
        $
      </text>
    </svg>
  </div>
</div>

{{ end }}
